[project]
name = "guarded-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Charles Oselukwue", email = "oselukwuecharles@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ddgs>=9.16.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
guarded-agent = "guarded_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
